name: Owner payout

# One deliberate money movement, started by hand, on the PayPal rail only.
# The step env maps the dispatch inputs to INPUT_* because workflow_dispatch
# inputs are not exported as environment variables to `run` steps.

on:
  workflow_dispatch:
    inputs:
      rail:
        description: Payout rail (only PayPal is implemented in this workflow)
        type: choice
        required: false
        default: paypal
        options:
          - paypal
      amount:
        description: Amount to send (positive number)
        type: string
        required: true
      currency:
        description: ISO currency code
        type: string
        required: true
        default: USD
      email:
        description: Owner PayPal account (must be in src/policy/RecipientRegistry.mjs)
        type: string
        required: true
      note:
        description: Note shown to the recipient
        type: string
        required: false
        default: Owner payout
      idempotency_key:
        description: >-
          Payment reference. Leave empty to derive one from amount, currency,
          email and note; a re-run with the same key is refused by PayPal
          instead of paying twice.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: owner-payout
  cancel-in-progress: false

jobs:
  payout:
    name: Send one PayPal payout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: payouts

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Execute PayPal payout
        id: payout
        env:
          INPUT_RAIL: ${{ inputs.rail }}
          INPUT_AMOUNT: ${{ inputs.amount }}
          INPUT_CURRENCY: ${{ inputs.currency }}
          INPUT_EMAIL: ${{ inputs.email }}
          INPUT_NOTE: ${{ inputs.note }}
          INPUT_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ vars.PAYPAL_MODE || 'live' }}
          # The token layer refuses a sandbox endpoint only when live mode is
          # declared; without these, a sandbox base URL would pay out for real
          # money's worth of nothing.
          SWARM_LIVE: 'true'
          NO_PLATFORM_WALLET: 'true'
          PAYPAL_DISABLED: ${{ vars.PAYPAL_DISABLED || 'false' }}
          PAYPAL_PPP2_APPROVED: ${{ vars.PAYPAL_PPP2_APPROVED || 'false' }}
          PAYPAL_PPP2_ENABLE_SEND: ${{ vars.PAYPAL_PPP2_ENABLE_SEND || 'false' }}
        run: |
          set -euo pipefail
          # inputs.rail defaults to paypal, but a workflow_call or API payload
          # could leave the mapping empty; an empty rail must still mean paypal.
          if [ "${INPUT_RAIL:-paypal}" != "paypal" ]; then
            echo "::error::Only the PayPal rail is supported by this workflow; no payout was attempted."
            exit 1
          fi
          node ./scripts/payout-paypal-once.mjs --confirm \
            --amount "$INPUT_AMOUNT" \
            --currency "$INPUT_CURRENCY" \
            --email "$INPUT_EMAIL" \
            --note "$INPUT_NOTE" \
            --idempotency-key "$INPUT_IDEMPOTENCY_KEY" > out.json
          cat out.json
          node ./scripts/check-owner-payout-result.mjs < out.json

      - name: Confirm the batch with PayPal
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_MODE: ${{ vars.PAYPAL_MODE || 'live' }}
        run: |
          set -euo pipefail
          # A submitted batch is not a settled one. Poll PayPal's batch details
          # so FAILED, UNCLAIMED or still-processing items fail this run instead
          # of leaving a green summary and a 90-day artifact nobody reads.
          set +e
          node ./scripts/confirm-owner-payout.mjs --from-result out.json \
            --wait-seconds 180 --interval-seconds 10 > confirmation.json
          status=$?
          cat confirmation.json
          exit "$status"

      - name: Keep the payout result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-payout-result
          path: |
            out.json
            confirmation.json
          if-no-files-found: warn
          retention-days: 90
