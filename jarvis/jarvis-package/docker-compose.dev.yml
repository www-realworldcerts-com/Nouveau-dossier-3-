# =============================================================================
# JARVIS AI Agent System - Docker Compose Development Override
# =============================================================================
# This file overrides docker-compose.yml for development environments.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # JARVIS Agent - Development Override
  # ---------------------------------------------------------------------------
  jarvis-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - JARVIS_ENV=development
    container_name: jarvis-agent-dev
    environment:
      - JARVIS_ENV=development
      - JARVIS_DEBUG=true
      - JARVIS_LOG_LEVEL=debug
      - JARVIS_WORKERS=1
      - PYTHONDEBUG=1
      - PYTHONDONTWRITEBYTECODE=0
    volumes:
      # Mount source code for hot reload
      - ./python-agent:/app/python-agent:ro
      - ./python-agent/config.yaml:/app/config/config.yaml:ro
      - ./python-agent/main.py:/app/main.py:ro
      # Persist data directories
      - jarvis-agent-data:/app/data
      - jarvis-agent-logs:/app/logs
      - jarvis-agent-uploads:/app/uploads
      - jarvis-agent-cache:/app/cache
    # Override entrypoint for hot reload with uvicorn --reload
    entrypoint: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "debug"]
    ports:
      # API port
      - "8000:8000"
      # Debug port for Python debugger (debugpy)
      - "5678:5678"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
    # Enable stdin and tty for interactive debugging
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # JARVIS Web - Development Override
  # ---------------------------------------------------------------------------
  jarvis-web:
    build:
      context: ..
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENV=development
    container_name: jarvis-web-dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_JARVIS_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount source code for hot reload
      - ../src:/app/src:ro
      - ../public:/app/public:ro
      - ../prisma:/app/prisma:ro
      # Persist data
      - jarvis-web-data:/app/data
      - jarvis-web-logs:/app/logs
      # Exclude node_modules from mount
      - /app/node_modules
      - /app/.next
    ports:
      # Next.js dev server
      - "3000:3000"
      # Next.js debug port
      - "9229:9229"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/jarvis/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    # Enable stdin and tty for interactive debugging
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Redis - Development Override (with RedisInsight)
  # ---------------------------------------------------------------------------
  redis:
    container_name: jarvis-redis-dev
    command: >
      redis-server
      --requirepass jarvis_redis_2024
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync always
      --save 60 1
      --loglevel verbose
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------------------
  # RedisInsight - Redis GUI (Development Only)
  # ---------------------------------------------------------------------------
  redis-insight:
    image: redis/redisinsight:latest
    container_name: jarvis-redis-insight
    hostname: redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - jarvis-redis-insight-data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jarvis-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    profiles:
      - tools

  # ---------------------------------------------------------------------------
  # MailHog - Email Testing (Development Only)
  # ---------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jarvis-mailhog
    hostname: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - jarvis-network
    profiles:
      - tools

# =============================================================================
# Volumes
# =============================================================================
volumes:
  jarvis-agent-data:
  jarvis-agent-logs:
  jarvis-agent-uploads:
  jarvis-agent-cache:
  jarvis-web-data:
  jarvis-web-logs:
  jarvis-redis-data:
  jarvis-redis-insight-data:

# =============================================================================
# Networks
# =============================================================================
networks:
  jarvis-network:
    driver: bridge
    name: jarvis-network-dev
