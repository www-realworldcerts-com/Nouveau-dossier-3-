# =============================================================================
# JARVIS AI Agent System - Kubernetes Deployment
# =============================================================================
# Deploys:
#   - jarvis-agent: Python FastAPI backend (2 replicas)
#   - jarvis-web:   Next.js frontend application (2 replicas)
# =============================================================================

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-agent
  namespace: jarvis
  labels:
    app: jarvis-agent
    component: backend
    version: v2.0.0
    managed-by: jarvis-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jarvis-agent
        component: backend
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: registry-secret
      terminationGracePeriodSeconds: 60
      serviceAccountName: jarvis-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z ${REDIS_HOST} ${REDIS_PORT}; do echo "Waiting for Redis..."; sleep 2; done;']
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: jarvis-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: jarvis-config
                  key: REDIS_PORT
      containers:
        - name: jarvis-agent
          image: ghcr.io/jarvis-ai/jarvis-agent:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jarvis-config
            - secretRef:
                name: jarvis-secrets
          env:
            - name: JARVIS_ENV
              value: production
            - name: JARVIS_HOST
              value: "0.0.0.0"
            - name: JARVIS_PORT
              value: "8000"
            - name: JARVIS_WORKERS
              value: "4"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: uploads
              mountPath: /app/uploads
            - name: cache
              mountPath: /app/cache
            - name: config
              mountPath: /app/config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jarvis-agent-data
        - name: logs
          emptyDir:
            sizeLimit: 500Mi
        - name: uploads
          persistentVolumeClaim:
            claimName: jarvis-agent-uploads
        - name: cache
          emptyDir:
            sizeLimit: 256Mi
        - name: config
          configMap:
            name: jarvis-agent-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jarvis-agent
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: jarvis-agent

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-web
  namespace: jarvis
  labels:
    app: jarvis-web
    component: frontend
    version: v2.0.0
    managed-by: jarvis-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jarvis-web
        component: frontend
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: registry-secret
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-agent
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z jarvis-agent 8000; do echo "Waiting for JARVIS Agent..."; sleep 3; done;']
      containers:
        - name: jarvis-web
          image: ghcr.io/jarvis-ai/jarvis-web:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jarvis-web-config
            - secretRef:
                name: jarvis-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_JARVIS_API_URL
              value: http://jarvis-agent:8000
            - name: NEXT_PUBLIC_WS_URL
              value: ws://jarvis-agent:8000
            - name: JARVIS_AGENT_INTERNAL_URL
              value: http://jarvis-agent:8000
            - name: PORT
              value: "3000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/jarvis/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /api/jarvis/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /api/jarvis/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
            successThreshold: 1
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jarvis-web-data
        - name: logs
          emptyDir:
            sizeLimit: 200Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jarvis-web
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: jarvis-web

---
# ConfigMap for shared JARVIS configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: jarvis
data:
  JARVIS_ENV: "production"
  JARVIS_HOST: "0.0.0.0"
  JARVIS_PORT: "8000"
  JARVIS_WORKERS: "4"
  JARVIS_LOG_LEVEL: "info"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  SWARM_ENABLED: "true"
  SWARM_MAX_AGENTS: "10"
  UPLOAD_MAX_SIZE: "52428800"
  CORS_ALLOWED_ORIGINS: "https://jarvis.example.com"

---
# ConfigMap for JARVIS Agent specific config
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-agent-config
  namespace: jarvis

---
# ConfigMap for JARVIS Web specific config
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-web-config
  namespace: jarvis
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_APP_NAME: "JARVIS"
  NEXT_PUBLIC_APP_VERSION: "2.0.0"
  NEXT_PUBLIC_ENABLE_VOICE: "true"
  NEXT_PUBLIC_ENABLE_SWARM: "true"
  NEXT_PUBLIC_ENABLE_FILES: "true"
  NEXT_PUBLIC_ENCRYPTION_ENABLED: "true"

---
# Secrets (values should be set via sealed-secrets or external-secrets in production)
apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
  namespace: jarvis
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_A_VERY_LONG_RANDOM_KEY"
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTES_ENCRYPTION_KEY"
  REDIS_PASSWORD: "jarvis_redis_2024"
  DATABASE_URL: "sqlite:///app/data/jarvis.db"

---
# ServiceAccount for JARVIS Agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-agent
  namespace: jarvis
  labels:
    app: jarvis-agent

---
# PersistentVolumeClaims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-agent-data
  namespace: jarvis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-agent-uploads
  namespace: jarvis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-web-data
  namespace: jarvis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: standard
