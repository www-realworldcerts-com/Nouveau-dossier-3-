# =============================================================================
# JARVIS AI Agent System - Kubernetes Services
# =============================================================================
# ClusterIP services for internal communication between components.
# External traffic is routed through the Ingress controller.
# =============================================================================

---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-agent
  namespace: jarvis
  labels:
    app: jarvis-agent
    component: backend
    service: jarvis-agent
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: jarvis-agent
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-web
  namespace: jarvis
  labels:
    app: jarvis-web
    component: frontend
    service: jarvis-web
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: jarvis-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jarvis
  labels:
    app: redis
    component: cache
    service: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
# Headless service for Redis StatefulSet (if used)
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: jarvis
  labels:
    app: redis
    component: cache
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
